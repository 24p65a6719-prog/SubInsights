name: sub_insights
description: SubInsights - Aggregates subscription benefits and sends location-based offer notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  provider: ^6.1.4
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  google_sign_in: ^6.2.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
