<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubInsights - Verify Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .email-display {
            background: #f5f7fa;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
            color: #2c3e50;
            font-weight: 500;
            word-break: break-all;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }

        .otp-input-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            font-weight: bold;
            transition: border-color 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .otp-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .otp-input.filled {
            border-color: #27ae60;
            background: #f0fdf4;
        }

        .otp-input.error {
            border-color: #e74c3c;
            background: #fdf4f4;
        }

        .form-group.full {
            margin-bottom: 0;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .timer {
            text-align: center;
            color: #e74c3c;
            font-size: 14px;
            margin: 15px 0;
            font-weight: 600;
        }

        .timer.warning {
            color: #f39c12;
        }

        .timer.safe {
            color: #27ae60;
        }

        .btn-verify {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-verify:active {
            transform: translateY(0);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .resend-container {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .resend-text {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-resend {
            color: #667eea;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 0;
            text-decoration: underline;
            font-size: 14px;
        }

        .btn-resend:hover {
            text-decoration: none;
        }

        .btn-resend:disabled {
            color: #bdc3c7;
            cursor: not-allowed;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .progress-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ecf0f1;
            transition: background 0.3s ease;
        }

        .progress-dot.active {
            background: #667eea;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px;
            }

            .logo {
                font-size: 40px;
            }

            .otp-input-container {
                grid-template-columns: repeat(6, 1fr);
                gap: 8px;
            }

            .otp-input {
                padding: 12px 8px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="auth-card">
            <div class="progress-dots">
                <div class="progress-dot active"></div>
                <div class="progress-dot active"></div>
                <div class="progress-dot"></div>
            </div>

            <div class="header">
                <div class="logo">📧</div>
                <h1>Verify Your Email</h1>
                <p>Enter the 6-digit code sent to your email</p>
                <div class="email-display" id="emailDisplay"></div>
            </div>

            <div id="alertContainer"></div>

            <form id="verifyForm">
                <div class="form-group">
                    <label>Enter OTP Code</label>
                    <div class="otp-input-container" id="otpContainer">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    </div>
                </div>

                <div class="timer safe">
                    ⏱️ <span id="timerText">OTP Valid for 15 minutes</span>
                </div>

                <button type="submit" class="btn-verify">Verify Email</button>
            </form>

            <div class="resend-container">
                <div class="resend-text">Didn't receive the code?</div>
                <button type="button" class="btn-resend" id="resendBtn">Resend OTP</button>
            </div>

            <div class="footer">
                <p><a href="register.html">Back to registration</a></p>
            </div>
        </div>
    </div>

    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyForm = document.getElementById('verifyForm');
        const alertContainer = document.getElementById('alertContainer');
        const emailDisplay = document.getElementById('emailDisplay');
        const resendBtn = document.getElementById('resendBtn');
        let resendCountdown = 0;

        // Display email from localStorage
        const registrationEmail = localStorage.getItem('registrationEmail') || 'your@email.com';
        emailDisplay.textContent = registrationEmail;

        // OTP Input handling
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;

                if (value && /^\d$/.test(value)) {
                    input.classList.add('filled');

                    // Move to next input
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }

                    // Check if all inputs are filled
                    if (allInputFilled()) {
                        // Auto-submit after delay
                        setTimeout(submitOTP, 500);
                    }
                } else {
                    input.classList.remove('filled');
                    e.target.value = '';
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
                if (e.key === 'ArrowLeft' && index > 0) {
                    otpInputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = (e.clipboardData || window.clipboardData).getData('text');
                const digits = pastedData.replace(/\D/g, '').slice(0, 6);

                if (digits.length > 0) {
                    digits.split('').forEach((digit, i) => {
                        if (i < otpInputs.length) {
                            otpInputs[i].value = digit;
                            otpInputs[i].classList.add('filled');
                        }
                    });

                    if (digits.length === 6) {
                        setTimeout(submitOTP, 500);
                    }
                }
            });
        });

        function allInputFilled() {
            return Array.from(otpInputs).every(input => input.value !== '');
        }

        function getOTPCode() {
            return Array.from(otpInputs).map(input => input.value).join('');
        }

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!allInputFilled()) {
                showAlert('Please enter the complete OTP code', 'error');
                return;
            }

            await submitOTP();
        });

        async function submitOTP() {
            const otpCode = getOTPCode();
            const email = registrationEmail;

            // Disable button
            const btn = document.querySelector('.btn-verify');
            const originalText = btn.textContent;
            btn.textContent = 'Verifying...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        otp_code: otpCode
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✓ ' + data.message, 'success');

                    // Store session if provided
                    if (data.session_id) {
                        localStorage.setItem('sessionId', data.session_id);
                    }

                    // Redirect to login or next page
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Verification failed', 'error');

                    // Mark inputs as error
                    otpInputs.forEach(input => {
                        input.classList.add('error');
                        input.value = '';
                        input.classList.remove('filled');
                    });

                    otpInputs[0].focus();

                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        resendBtn.addEventListener('click', async () => {
            if (resendCountdown > 0) return;

            const email = registrationEmail;

            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✓ ' + data.message, 'success');

                    // Clear inputs
                    otpInputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled', 'error');
                    });
                    otpInputs[0].focus();

                    // Start countdown
                    startResendCountdown();
                } else {
                    showAlert(data.message || 'Failed to resend OTP', 'error');
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend OTP';
                }
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend OTP';
            }
        });

        function startResendCountdown() {
            resendCountdown = 60;
            const updateCountdown = () => {
                if (resendCountdown > 0) {
                    resendBtn.textContent = `Resend in ${resendCountdown}s`;
                    resendCountdown--;
                    setTimeout(updateCountdown, 1000);
                } else {
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend OTP';
                }
            };
            updateCountdown();
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            if (type !== 'error') {
                setTimeout(() => {
                    alert.classList.remove('show');
                }, 3000);
            }
        }

        // Set focus to first input
        otpInputs[0].focus();
    </script>
</body>

</html>
