<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubInsights - Verify Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.5;
        }

        .email-badge {
            background: #f0f4ff;
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 10px 14px;
            text-align: center;
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 25px;
            word-break: break-all;
        }

        .otp-label {
            display: block;
            text-align: center;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 50px;
            height: 58px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            transition: all 0.2s;
        }

        .otp-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .otp-input.filled {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .otp-input.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .timer {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .timer span {
            color: #e74c3c;
            font-weight: bold;
        }

        .btn-verify {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .resend-section {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }

        .resend-btn:disabled {
            color: #bdc3c7;
            cursor: not-allowed;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #667eea;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="auth-card">
            <div class="header">
                <div class="logo">🔑</div>
                <h1>Login Verification</h1>
                <p>A 6-digit OTP has been sent to your email. Enter it below to complete your login.</p>
            </div>

            <div id="alertContainer"></div>

            <div class="email-badge" id="emailBadge">Loading...</div>



            <form id="otpForm">
                <label class="otp-label">Enter 6-Digit OTP</label>
                <div class="otp-inputs" id="otpInputsContainer">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp0">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp1">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp2">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp3">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp4">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp5">
                </div>

                <div class="timer">OTP expires in: <span id="timerDisplay">15:00</span></div>

                <button type="submit" class="btn-verify" id="verifyBtn">Verify & Login</button>
            </form>

            <div class="resend-section">
                Didn't receive the OTP?
                <button class="resend-btn" id="resendBtn">Resend OTP</button>
            </div>

            <a href="login.html" class="back-link">← Back to Login</a>
        </div>
    </div>

    <script>
        const alertContainer = document.getElementById('alertContainer');
        const otpInputs = Array.from(document.querySelectorAll('.otp-input'));
        const verifyBtn = document.getElementById('verifyBtn');
        const resendBtn = document.getElementById('resendBtn');

        // Get email from localStorage (set by login-register.html)
        const loginEmail = localStorage.getItem('loginEmail');
        if (!loginEmail) {
            window.location.href = '/login-register.html';
        }
        document.getElementById('emailBadge').textContent = loginEmail;

        // OTP input handling
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && /^\d$/.test(val)) {
                    input.classList.add('filled');
                    if (index < 5) otpInputs[index + 1].focus();
                    if (allFilled()) setTimeout(submitOTP, 400);
                } else {
                    input.classList.remove('filled');
                    e.target.value = '';
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                    otpInputs[index - 1].value = '';
                    otpInputs[index - 1].classList.remove('filled');
                }
            });
        });

        // Paste support
        otpInputs[0].addEventListener('paste', (e) => {
            e.preventDefault();
            const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
            pasted.split('').forEach((ch, i) => {
                if (otpInputs[i]) {
                    otpInputs[i].value = ch;
                    otpInputs[i].classList.add('filled');
                }
            });
            if (allFilled()) setTimeout(submitOTP, 400);
        });

        function allFilled() {
            return otpInputs.every(i => i.value.length === 1);
        }

        function getOTP() {
            return otpInputs.map(i => i.value).join('');
        }

        // Countdown timer
        let secondsLeft = 900;
        const timerEl = document.getElementById('timerDisplay');
        const timerInterval = setInterval(() => {
            secondsLeft--;
            const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
            const s = (secondsLeft % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                timerEl.textContent = 'Expired';
                showAlert('OTP has expired. Please request a new one.', 'error');
                verifyBtn.disabled = true;
            }
        }, 1000);

        // Form submit
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!allFilled()) {
                showAlert('Please enter all 6 digits', 'error');
                return;
            }
            await submitOTP();
        });

        async function submitOTP() {
            const otp = getOTP();
            verifyBtn.textContent = 'Verifying...';
            verifyBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/verify-login-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: loginEmail, otp_code: otp })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('✓ ' + data.message, 'success');
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userName', data.full_name);
                    localStorage.removeItem('loginEmail');

                    clearInterval(timerInterval);

                    // Redirect to marketplace
                    setTimeout(() => {
                        window.location.href = '../subscriptions/marketplace.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Invalid OTP. Please try again.', 'error');
                    otpInputs.forEach(i => i.classList.add('error'));
                    setTimeout(() => otpInputs.forEach(i => i.classList.remove('error')), 1500);
                    verifyBtn.textContent = 'Verify & Login';
                    verifyBtn.disabled = false;
                }
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
                verifyBtn.textContent = 'Verify & Login';
                verifyBtn.disabled = false;
            }
        }

        // Resend OTP
        resendBtn.addEventListener('click', async () => {
            resendBtn.disabled = true;
            try {
                const response = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: loginEmail })
                });
                const data = await response.json();
                showAlert(data.message || 'New OTP sent!', data.success ? 'success' : 'error');

                // Reset timer
                secondsLeft = 900;
            } catch (e) {
                showAlert('Failed to resend OTP', 'error');
            }
            setTimeout(() => resendBtn.disabled = false, 30000);
        });

        function showAlert(message, type) {
            const el = document.createElement('div');
            el.className = `alert alert-${type} show`;
            el.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(el);
            if (type !== 'error') {
                setTimeout(() => el.classList.remove('show'), 4000);
            }
        }
    </script>
</body>

</html>
