<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubInsights - Login & Register</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Microsoft MSAL.js -->
    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .tagline {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .toggle-auth a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-auth a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            border: 1px solid #fcc;
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            border: 1px solid #cfc;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ecf0f1;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 14px;
            color: #bdc3c7;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ecf0f1;
        }

        .social-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 16px;
            border-radius: 8px;
            border: 1.5px solid #e0e0e0;
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            font-family: inherit;
            color: #3c4043;
        }

        .social-btn:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
            border-color: #bbb;
            transform: translateY(-1px);
        }

        .social-btn:active {
            transform: translateY(0);
        }

        .social-btn svg {
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="auth-card">
            <!-- Header -->
            <div class="header">
                <div class="logo"><img src="/images/logo.svg" alt="SubInsights"
                        style="height:36px;vertical-align:middle;margin-right:8px;">SubInsights</div>
                <p class="tagline">Location-aware membership benefit discovery</p>
            </div>

            <!-- Messages -->
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <!-- Login Form -->
            <div class="form-section active" id="login-form">
                <h2 style="margin-bottom: 20px; color: #2c3e50; font-size: 18px;">Sign In</h2>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="loading" id="login-loading">
                    <span class="spinner"></span> Signing in...
                </div>

                <button class="btn" id="login-btn" onclick="handleLogin()">Sign In</button>

                <!-- Social Login -->
                <div class="divider">or continue with</div>
                <div class="social-btns">
                    <button class="social-btn" id="google-login-btn" onclick="handleGoogleLogin()">
                        <!-- Official Google logo -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                        </svg>
                        Continue with Google
                    </button>
                </div>

                <div class="toggle-auth">
                    Don't have an account? <a onclick="toggleForm()">Create one</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-section" id="register-form">
                <h2 style="margin-bottom: 20px; color: #2c3e50; font-size: 18px;">Create Account</h2>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>First Name</label>
                        <input type="text" id="register-firstname" placeholder="John" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Last Name</label>
                        <input type="text" id="register-lastname" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="register-email" placeholder="" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="register-password" placeholder="" required>
                </div>

                <div class="form-group">
                    <label>Phone (Optional)</label>
                    <input type="tel" id="register-phone" placeholder="+1234567890">
                </div>

                <div class="loading" id="register-loading">
                    <span class="spinner"></span> Creating account...
                </div>

                <button class="btn" id="register-btn" onclick="handleRegister()">Create Account</button>

                <div class="toggle-auth">
                    Already have an account? <a onclick="toggleForm()">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.origin}/api`;

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = message;
            successEl.style.display = 'block';
            setTimeout(() => {
                successEl.style.display = 'none';
            }, 5000);
        }

        function toggleForm() {
            document.getElementById('login-form').classList.toggle('active');
            document.getElementById('register-form').classList.toggle('active');
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            const btn = document.getElementById('login-btn');
            const loading = document.getElementById('login-loading');
            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store email for OTP verification step
                    localStorage.setItem('loginEmail', email);
                    showSuccess('Password verified! OTP sent to your email...');
                    setTimeout(() => {
                        window.location.href = '/auth/verify-login.html';
                    }, 1500);
                } else {
                    showError(data.message || 'Login failed');
                    btn.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                showError('Connection error: ' + error.message);
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        async function handleRegister() {
            const firstName = document.getElementById('register-firstname').value.trim();
            const lastName = document.getElementById('register-lastname').value.trim();
            const name = `${firstName} ${lastName}`.trim();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const phone = document.getElementById('register-phone').value;

            if (!firstName || !lastName || !email || !password) {
                showError('Please fill in all required fields');
                return;
            }

            const btn = document.getElementById('register-btn');
            const loading = document.getElementById('register-loading');
            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: name,
                        email: email,
                        password: password,
                        phone: phone
                    })
                });

                const data = await response.json();
                if (data.success) {
                    // Store info for OTP verification
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('email', data.email);
                    localStorage.setItem('full_name', name);

                    // Store demo OTP if provided (in demo mode)
                    if (data.demo_otp) {
                        localStorage.setItem('demo_otp', data.demo_otp);
                    }

                    showSuccess('Account created! OTP sent to your email.');

                    // Redirect to OTP verification page
                    setTimeout(() => {
                        window.location.href = '/verify-otp.html';
                    }, 1500);
                } else {
                    showError(data.message || 'Registration failed');
                    btn.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                showError('Connection error: ' + error.message);
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        // ── OAuth Configuration ─────────────────────────────────────────────────
        // Replace these with your own credentials:
        // Google: https://console.cloud.google.com/  → APIs & Services → Credentials
        // Microsoft: https://portal.azure.com/ → Azure Active Directory → App registrations
        const OAUTH_CONFIG = {
            google: {
                clientId: '46599484568-65ths0c1r85g6nfm78mseafcpi6ol72d.apps.googleusercontent.com'
            },
            microsoft: {
                clientId: 'YOUR_MICROSOFT_APP_CLIENT_ID',
                authority: 'https://login.microsoftonline.com/common',
                redirectUri: window.location.origin
            }
        };

        // ── Google Sign-In ─────────────────────────────────────────────────────
        function handleGoogleLogin() {
            if (OAUTH_CONFIG.google.clientId.includes('YOUR_GOOGLE')) {
                showError('Google login is not configured yet. Please set your Google Client ID.');
                return;
            }
            google.accounts.oauth2.initTokenClient({
                client_id: OAUTH_CONFIG.google.clientId,
                scope: 'email profile openid',
                callback: async (tokenResponse) => {
                    if (tokenResponse.error) {
                        showError('Google login failed: ' + tokenResponse.error);
                        return;
                    }
                    // Fetch user info using the access token
                    try {
                        const userInfoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
                        });
                        const user = await userInfoRes.json();
                        showSuccess(`Welcome, ${user.name}! Signing you in...`);
                        localStorage.setItem('userEmail', user.email);
                        localStorage.setItem('userName', user.name);
                        localStorage.setItem('sessionId', 'google_' + Date.now());
                        setTimeout(() => {
                            window.location.href = '/subscriptions/marketplace.html';
                        }, 1200);
                    } catch (e) {
                        showError('Failed to get Google profile.');
                    }
                }
            }).requestAccessToken();
        }

        // ── Microsoft Sign-In ──────────────────────────────────────────────────
        async function handleMicrosoftLogin() {
            if (OAUTH_CONFIG.microsoft.clientId.includes('YOUR_MICROSOFT')) {
                showError('Microsoft login is not configured yet. Please set your Microsoft Client ID.');
                return;
            }
            try {
                const msalInstance = new msal.PublicClientApplication({
                    auth: {
                        clientId: OAUTH_CONFIG.microsoft.clientId,
                        authority: OAUTH_CONFIG.microsoft.authority,
                        redirectUri: OAUTH_CONFIG.microsoft.redirectUri
                    },
                    cache: { cacheLocation: 'sessionStorage' }
                });
                await msalInstance.initialize();
                const loginResponse = await msalInstance.loginPopup({
                    scopes: ['openid', 'profile', 'email', 'User.Read']
                });
                const account = loginResponse.account;
                showSuccess(`Welcome, ${account.name}! Signing you in...`);
                localStorage.setItem('userEmail', account.username);
                localStorage.setItem('userName', account.name);
                localStorage.setItem('sessionId', 'ms_' + Date.now());
                setTimeout(() => {
                    window.location.href = '/subscriptions/marketplace.html';
                }, 1200);
            } catch (err) {
                if (!err.message?.includes('user_cancelled')) {
                    showError('Microsoft login failed: ' + err.message);
                }
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('login-form').classList.contains('active')) {
                    handleLogin();
                } else {
                    handleRegister();
                }
            }
        });
    </script>
</body>

</html>
